name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ktlint
        run: |
          set -o pipefail
          if ! ./gradlew ktlintCheck --stacktrace 2>&1 | tee /tmp/ktlint.log; then
            grep -E "\.kt|\.kts|FAILURE|What went wrong|^> " /tmp/ktlint.log | tail -n 30 | while IFS= read -r l; do echo "::error title=ktlint::$l"; done
            exit 1
          fi
      - name: Run detekt
        run: |
          set -o pipefail
          if ! ./gradlew detekt --stacktrace 2>&1 | tee /tmp/detekt.log; then
            grep -E "\.kt|FAILURE|What went wrong|^> | - \[" /tmp/detekt.log | tail -n 30 | while IFS= read -r l; do echo "::error title=detekt::$l"; done
            exit 1
          fi
      - name: Run Android Lint
        run: |
          set -o pipefail
          if ! ./gradlew lintOfflineDebug --stacktrace 2>&1 | tee /tmp/lint.log; then
            grep -E "Error:|FAILURE|What went wrong|^> " /tmp/lint.log | tail -n 30 | while IFS= read -r l; do echo "::error title=android-lint::$l"; done
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM & Robolectric Unit Tests
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest :app:testOfflineDebugUnitTest :core:model:test :core:permissions:test :core:engine:test :privilege:api:test --stacktrace 2>&1 | tee /tmp/test.log; then
            grep -E "FAILED|FAILURE|What went wrong|^> |AssertionError|Exception" /tmp/test.log | tail -n 40 | while IFS= read -r l; do echo "::error title=unit-test::$l"; done
            exit 1
          fi

  build:
    name: Assemble & Policy Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble Debug & Release APKs
        run: |
          set -o pipefail
          if ! ./gradlew assembleOfflineDebug assembleOfflineRelease --stacktrace 2>&1 | tee /tmp/build.log; then
            grep -E "e:|FAILURE|What went wrong|^> " /tmp/build.log | tail -n 40 | while IFS= read -r l; do echo "::error title=build::$l"; done
            exit 1
          fi
      - name: Verify Default Build Has No INTERNET Permission
        run: |
          MANIFEST=$(find app/build/intermediates/merged_manifest/offlineDebug -name "AndroidManifest.xml" | head -n 1)
          test -n "$MANIFEST"
          if grep -q "android.permission.INTERNET" "$MANIFEST"; then
            echo "::error title=policy::Default offline flavor must NEVER request android.permission.INTERNET"
            exit 1
          fi
          echo "Verified: No INTERNET permission in default offline flavor ($MANIFEST)."
      - name: Verify Release APK Size Under 15 MB
        run: |
          APK=$(find app/build/outputs/apk/offline/release -name "*.apk" | head -n 1)
          test -n "$APK"
          SIZE_BYTES=$(stat -c%s "$APK")
          echo "Release APK: $APK ($SIZE_BYTES bytes)"
          echo "### APK Size Gate: $SIZE_BYTES bytes (< 15,728,640 bytes)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_BYTES" -ge 15728640 ]; then
            echo "::error title=apk-size::Release APK exceeds 15 MB ($SIZE_BYTES bytes)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: routine-apks
          path: app/build/outputs/apk/**/*.apk
