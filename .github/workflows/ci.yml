name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run ktlint
        run: |
          set -o pipefail
          if ! ./gradlew ktlintCheck --stacktrace 2>&1 | tee /tmp/ktlint.log; then
            grep -E "\.(kt|kts):[0-9]+|Caused by:|What went wrong" /tmp/ktlint.log | head -n 9 | while IFS= read -r l; do echo "::error title=ktlint::$l"; done
            exit 1
          fi
      - name: Run detekt
        run: |
          set -o pipefail
          if ! ./gradlew detekt --stacktrace 2>&1 | tee /tmp/detekt.log; then
            grep -E "\.kt:[0-9]+| - \[|Caused by:|What went wrong" /tmp/detekt.log | head -n 9 | while IFS= read -r l; do echo "::error title=detekt::$l"; done
            exit 1
          fi
      - name: Run Android Lint
        run: |
          set -o pipefail
          if ! ./gradlew lintOfflineDebug --stacktrace 2>&1 | tee /tmp/lint.log; then
            grep -E "^e: |Error:|What went wrong" /tmp/lint.log | head -n 9 | while IFS= read -r l; do echo "::error title=android-lint::$l"; done
            exit 1
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run JVM, Robolectric, Compose & JaCoCo Coverage Gates
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest :app:testOfflineDebugUnitTest :core:model:test :core:permissions:test :core:engine:test :privilege:api:test :core:data:verifyCoreDataJacocoCoverage --stacktrace 2>&1 | tee /tmp/test.log; then
            grep -E "^e: |FAILED|AssertionError|Rule violated|What went wrong|Caused by:" /tmp/test.log | head -n 9 | while IFS= read -r l; do echo "::error title=unit-test::$l"; done
            exit 1
          fi

  build:
    name: Assemble & Policy Gate
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/routine-release.jks \
            -storetype PKCS12 \
            -alias routine \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass routine-alpha \
            -keypass routine-alpha \
            -dname "CN=Routine Open Source, OU=Android, O=Routine, L=OpenSource, ST=Global, C=US"
      - name: Assemble Signed Debug & Release APKs
        env:
          SIGNING_STORE_FILE: /tmp/routine-release.jks
        run: |
          set -o pipefail
          if ! ./gradlew assembleOfflineDebug assembleOfflineRelease assembleWirelessAdbRelease --stacktrace 2>&1 | tee /tmp/build.log; then
            grep -E "^e: |Error:|What went wrong|Caused by:" /tmp/build.log | head -n 9 | while IFS= read -r l; do echo "::error title=build::$l"; done
            exit 1
          fi
      - name: Verify Default Build Has No INTERNET Permission
        run: |
          for VARIANT in offlineDebug offlineRelease; do
            MANIFEST=$(find "app/build/intermediates/merged_manifest/${VARIANT}" -name "AndroidManifest.xml" | head -n 1)
            test -n "$MANIFEST"
            if grep -q "android.permission.INTERNET" "$MANIFEST"; then
              echo "::error title=policy::Default ${VARIANT} must NEVER request android.permission.INTERNET"
              exit 1
            fi
          done
          echo "Verified: No INTERNET permission in default offlineDebug or offlineRelease manifests."
      - name: Verify Release APK Size Under 15 MB
        run: |
          APK=$(find app/build/outputs/apk/offline/release -name "*.apk" | head -n 1)
          test -n "$APK"
          SIZE_BYTES=$(stat -c%s "$APK")
          echo "Offline Release APK: $APK ($SIZE_BYTES bytes)"
          echo "### APK Size Gate: $SIZE_BYTES bytes (< 15,728,640 bytes)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE_BYTES" -ge 15728640 ]; then
            echo "::error title=apk-size::Offline Release APK exceeds 15 MB ($SIZE_BYTES bytes)"
            exit 1
          fi
      - name: Verify Reproducible Release APK Build
        env:
          SIGNING_STORE_FILE: /tmp/routine-release.jks
        run: |
          APK_FIRST=$(find app/build/outputs/apk/offline/release -name "*.apk" | head -n 1)
          SHA_FIRST=$(sha256sum "$APK_FIRST" | awk '{print $1}')
          ./gradlew clean assembleOfflineRelease assembleWirelessAdbRelease --stacktrace
          APK_SECOND=$(find app/build/outputs/apk/offline/release -name "*.apk" | head -n 1)
          SHA_SECOND=$(sha256sum "$APK_SECOND" | awk '{print $1}')
          echo "First SHA256:  $SHA_FIRST"
          echo "Second SHA256: $SHA_SECOND"
          if [ "$SHA_FIRST" != "$SHA_SECOND" ]; then
            echo "::error title=reproducibility::Non-deterministic APK build ($SHA_FIRST != $SHA_SECOND)"
            exit 1
          fi
          echo "### Reproducible APK Verified: \`$SHA_FIRST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Boot Android 14 Emulator & Smoke-Test Signed Release APK
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=kvm::/dev/kvm unavailable on runner; skipping hardware emulator step"
            exit 0
          fi
          sudo chmod 666 /dev/kvm
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          cleanup() {
            timeout 5 adb emu kill >/dev/null 2>&1 || true
            [ -n "${EMU_PID:-}" ] && kill -9 "$EMU_PID" >/dev/null 2>&1 || true
            timeout 5 adb kill-server >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if ! "$SDKMANAGER" --install "platform-tools" "emulator" "platforms;android-34" "system-images;android-34;google_apis;x86_64" >/tmp/sdk.log 2>&1; then
            tail -n 10 /tmp/sdk.log | while IFS= read -r l; do echo "::error title=sdkmanager::$l"; done
            exit 1
          fi
          echo "no" | "$AVDMANAGER" create avd -n routine_smoke -k "system-images;android-34;google_apis;x86_64" --device "pixel_6" --force >/dev/null
          adb start-server >/dev/null 2>&1 || true
          "$ANDROID_HOME/emulator/emulator" -avd routine_smoke -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim </dev/null >/tmp/emulator.log 2>&1 &
          EMU_PID=$!
          BOOT_OK=0
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              tail -n 15 /tmp/emulator.log | while IFS= read -r l; do echo "::error title=emulator-boot::$l"; done
              exit 1
            fi
            BOOTED=$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOTED" = "1" ]; then
              BOOT_OK=1
              break
            fi
            sleep 2
          done
          if [ "$BOOT_OK" != "1" ]; then
            tail -n 15 /tmp/emulator.log | while IFS= read -r l; do echo "::error title=emulator-timeout::$l"; done
            exit 1
          fi
          sleep 4
          OFFLINE_APK=$(find app/build/outputs/apk/offline/release -name "*.apk" | head -n 1)
          python3 scripts/emulator_release_smoke.py "$OFFLINE_APK"
      - name: Publish v0.1.0-alpha Signed Release Artifacts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.0-alpha"
          OFFLINE_APK=$(find app/build/outputs/apk/offline/release -name "*.apk" | head -n 1)
          WIRELESS_APK=$(find app/build/outputs/apk/wirelessAdb/release -name "*.apk" | head -n 1)
          cp "$OFFLINE_APK" "Routine-${TAG}-offline.apk"
          cp "$WIRELESS_APK" "Routine-${TAG}-wirelessAdb.apk"
          sha256sum Routine-${TAG}-*.apk > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Routine-${TAG}-*.apk SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              Routine-${TAG}-*.apk SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "Routine ${TAG}" \
              --notes-file fastlane/metadata/android/en-US/changelogs/1.txt \
              --prerelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: routine-apks
          path: app/build/outputs/apk/*/release/*.apk


